<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" role="img"><style>text{font-family:"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#163047} .title{font-size:30px;font-weight:650}.label{font-size:22px;font-weight:600}.small{font-size:17px;fill:#4c6375}.number{font-size:23px;font-family:Menlo,monospace}</style><rect width="1240" height="610" fill="#ffffff"/><text x="60" y="52" class="title" text-anchor="start">contiguous：保持逻辑坐标值，复制成目标物理顺序</text><text x="60" y="90" class="small" text-anchor="start">输入 t 与输出 c 都是 shape=(4,3)；这次转换创建新的 storage。</text><text x="60" y="139" class="label" text-anchor="start">t：stride=(1,4)，仍共享原 storage</text><rect x="60" y="161" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="99.0" y="192" class="number" text-anchor="middle">0</text><text x="99" y="230" class="small" text-anchor="middle">[0]</text><rect x="153" y="161" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="192.0" y="192" class="number" text-anchor="middle">1</text><text x="192" y="230" class="small" text-anchor="middle">[1]</text><rect x="246" y="161" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="285.0" y="192" class="number" text-anchor="middle">2</text><text x="285" y="230" class="small" text-anchor="middle">[2]</text><rect x="339" y="161" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="378.0" y="192" class="number" text-anchor="middle">3</text><text x="378" y="230" class="small" text-anchor="middle">[3]</text><rect x="432" y="161" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="471.0" y="192" class="number" text-anchor="middle">4</text><text x="471" y="230" class="small" text-anchor="middle">[4]</text><rect x="525" y="161" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="564.0" y="192" class="number" text-anchor="middle">5</text><text x="564" y="230" class="small" text-anchor="middle">[5]</text><rect x="618" y="161" width="78" height="46" rx="7" fill="#ffdfaa" stroke="#c07715"/><text x="657.0" y="192" class="number" text-anchor="middle">6</text><text x="657" y="230" class="small" text-anchor="middle">[6]</text><rect x="711" y="161" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="750.0" y="192" class="number" text-anchor="middle">7</text><text x="750" y="230" class="small" text-anchor="middle">[7]</text><rect x="804" y="161" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="843.0" y="192" class="number" text-anchor="middle">8</text><text x="843" y="230" class="small" text-anchor="middle">[8]</text><rect x="897" y="161" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="936.0" y="192" class="number" text-anchor="middle">9</text><text x="936" y="230" class="small" text-anchor="middle">[9]</text><rect x="990" y="161" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="1029.0" y="192" class="number" text-anchor="middle">10</text><text x="1029" y="230" class="small" text-anchor="middle">[10]</text><rect x="1083" y="161" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="1122.0" y="192" class="number" text-anchor="middle">11</text><text x="1122" y="230" class="small" text-anchor="middle">[11]</text><rect x="60" y="267" width="1116" height="74" rx="12" fill="#edf7f2" stroke="#8dbdaa"/><text x="618" y="300" class="label" text-anchor="middle">t.contiguous()：依次读取 t 的逻辑行，再写入新 storage</text><text x="618" y="326" class="small" text-anchor="middle">读取位置：0,4,8 | 1,5,9 | 2,6,10 | 3,7,11</text><text x="60" y="391" class="label" text-anchor="start">c：stride=(3,1)，新的 storage</text><rect x="60" y="414" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="99.0" y="445" class="number" text-anchor="middle">0</text><text x="99" y="483" class="small" text-anchor="middle">[0]</text><rect x="153" y="414" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="192.0" y="445" class="number" text-anchor="middle">4</text><text x="192" y="483" class="small" text-anchor="middle">[1]</text><rect x="246" y="414" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="285.0" y="445" class="number" text-anchor="middle">8</text><text x="285" y="483" class="small" text-anchor="middle">[2]</text><rect x="339" y="414" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="378.0" y="445" class="number" text-anchor="middle">1</text><text x="378" y="483" class="small" text-anchor="middle">[3]</text><rect x="432" y="414" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="471.0" y="445" class="number" text-anchor="middle">5</text><text x="471" y="483" class="small" text-anchor="middle">[4]</text><rect x="525" y="414" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="564.0" y="445" class="number" text-anchor="middle">9</text><text x="564" y="483" class="small" text-anchor="middle">[5]</text><rect x="618" y="414" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="657.0" y="445" class="number" text-anchor="middle">2</text><text x="657" y="483" class="small" text-anchor="middle">[6]</text><rect x="711" y="414" width="78" height="46" rx="7" fill="#ffdfaa" stroke="#c07715"/><text x="750.0" y="445" class="number" text-anchor="middle">6</text><text x="750" y="483" class="small" text-anchor="middle">[7]</text><rect x="804" y="414" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="843.0" y="445" class="number" text-anchor="middle">10</text><text x="843" y="483" class="small" text-anchor="middle">[8]</text><rect x="897" y="414" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="936.0" y="445" class="number" text-anchor="middle">3</text><text x="936" y="483" class="small" text-anchor="middle">[9]</text><rect x="990" y="414" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="1029.0" y="445" class="number" text-anchor="middle">7</text><text x="1029" y="483" class="small" text-anchor="middle">[10]</text><rect x="1083" y="414" width="78" height="46" rx="7" fill="#eaf3fa" stroke="#afc6d9"/><text x="1122.0" y="445" class="number" text-anchor="middle">11</text><text x="1122" y="483" class="small" text-anchor="middle">[11]</text><text x="60" y="537" class="label" text-anchor="start">注意：新 storage 的 [7] 保存值 6；原 storage 的 [6] 仍保存值 6。</text><text x="60" y="574" class="small" text-anchor="start">复制改变物理排列；没有把 t 的逻辑行重新解释成 a 的逻辑行。</text></svg>
